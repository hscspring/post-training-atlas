<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Post-Training Atlas social preview</title>
  <desc id="desc">A dark editorial cover showing seven connected tracks in modern model post-training.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="850" cy="195" rx="410" ry="330" fill="url(#glowBlue)"/>
  <ellipse cx="1185" cy="570" rx="350" ry="290" fill="url(#glowViolet)"/>
  <rect x="1" y="1" width="1278" height="638" rx="24" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Editorial title block -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif">
    <rect x="64" y="54" width="250" height="34" rx="17" fill="#0f766e" fill-opacity="0.22" stroke="#5eead4" stroke-opacity="0.55"/>
    <circle cx="84" cy="71" r="4" fill="#5eead4"/>
    <text x="98" y="76" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="1.7">OPINIONATED · EVOLVING</text>

    <text x="64" y="174" fill="#f8fafc" font-size="55" font-weight="760" letter-spacing="-1.4">POST-TRAINING</text>
    <text x="60" y="270" fill="url(#accent)" font-size="98" font-weight="820" letter-spacing="-4">ATLAS</text>
    <text x="66" y="314" fill="#cbd5e1" font-size="24" font-weight="600" letter-spacing="4">后训练图谱</text>

    <text x="66" y="370" fill="#cbd5e1" font-size="19" font-weight="450">An opinionated map of how pretrained models are shaped</text>
    <text x="66" y="400" fill="#94a3b8" font-size="19" font-weight="450">through signals, objectives, estimators, and feedback loops.</text>

    <text x="66" y="464" fill="#67e8f9" font-size="17" font-weight="720" letter-spacing="1.15">RL  ·  REWARD  ·  SFT × RL</text>
    <text x="66" y="495" fill="#a5b4fc" font-size="17" font-weight="720" letter-spacing="1.1">DISTILLATION  ·  DISTRIBUTION ALIGNMENT</text>

    <line x1="66" y1="548" x2="566" y2="548" stroke="#64748b" stroke-opacity="0.35"/>
    <text x="66" y="585" fill="#e2e8f0" font-size="16" font-weight="650">github.com/hscspring/post-training-atlas</text>
    <text x="506" y="585" text-anchor="end" fill="#64748b" font-size="15">yam.gift</text>
  </g>

  <line x1="616" y1="56" x2="616" y2="584" stroke="url(#accent)" stroke-opacity="0.26"/>

  <!-- Topology -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="664" y="72" fill="#e2e8f0" font-size="15" font-weight="750" letter-spacing="1.8">SEVEN CONNECTED TRACKS</text>
    <text x="664" y="98" fill="#64748b" font-size="13">Mechanisms, not modalities</text>

    <!-- connections behind nodes -->
    <g fill="none" stroke="#64748b" stroke-opacity="0.78" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M 818 273 C 830 273, 825 177, 840 177"/>
      <path d="M 818 297 C 830 297, 825 377, 840 377"/>
      <path d="M 936 342 C 936 303, 936 250, 936 213"/>
      <path d="M 1028 162 C 1038 162, 1038 137, 1058 137"/>
      <path d="M 1028 177 C 1038 177, 1038 246, 1058 246"/>
      <path d="M 1028 190 C 1040 190, 1038 354, 1058 354"/>
      <path d="M 1028 377 C 1038 377, 1038 366, 1058 366"/>
      <path d="M 934 413 C 934 448, 934 470, 934 493"/>
      <path d="M 1140 169 C 1140 345, 1064 445, 1020 494"/>
      <path d="M 1140 278 C 1138 390, 1080 458, 1038 498"/>
      <path d="M 1140 386 C 1118 430, 1080 470, 1055 501"/>
    </g>

    <!-- track 01 -->
    <g filter="url(#shadow)">
      <rect x="630" y="249" width="188" height="71" rx="13" fill="#0f2534" stroke="#5eead4" stroke-width="1.5"/>
      <text x="648" y="277" fill="#5eead4" font-size="14" font-weight="800">01</text>
      <text x="681" y="277" fill="#f8fafc" font-size="16" font-weight="700">R1 Full-Chain</text>
      <text x="648" y="302" fill="#94a3b8" font-size="13">data · SFT · RL</text>
    </g>

    <!-- track 02 -->
    <g filter="url(#shadow)">
      <rect x="840" y="142" width="188" height="71" rx="13" fill="#111d36" stroke="#60a5fa" stroke-width="1.4"/>
      <text x="858" y="170" fill="#60a5fa" font-size="14" font-weight="800">02</text>
      <text x="891" y="170" fill="#f8fafc" font-size="16" font-weight="700">GRPO Family</text>
      <text x="858" y="195" fill="#94a3b8" font-size="13">policy optimization</text>
    </g>

    <!-- track 03 -->
    <g filter="url(#shadow)">
      <rect x="840" y="342" width="188" height="71" rx="13" fill="#17182f" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="858" y="370" fill="#c4b5fd" font-size="14" font-weight="800">03</text>
      <text x="891" y="370" fill="#f8fafc" font-size="14" font-weight="700">Reward &amp; Verifiers</text>
      <text x="858" y="395" fill="#94a3b8" font-size="13">learning signals</text>
    </g>

    <!-- track 04 -->
    <g filter="url(#shadow)">
      <rect x="1058" y="106" width="164" height="63" rx="12" fill="#121a2d" stroke="#475569"/>
      <text x="1076" y="134" fill="#67e8f9" font-size="14" font-weight="800">04</text>
      <text x="1109" y="134" fill="#f1f5f9" font-size="15" font-weight="700">MoE Stability</text>
      <text x="1076" y="155" fill="#64748b" font-size="12">architecture</text>
    </g>

    <!-- track 07 -->
    <g filter="url(#shadow)">
      <rect x="1058" y="215" width="164" height="63" rx="12" fill="#121a2d" stroke="#475569"/>
      <text x="1076" y="243" fill="#67e8f9" font-size="14" font-weight="800">07</text>
      <text x="1109" y="243" fill="#f1f5f9" font-size="15" font-weight="700">Agentic RL</text>
      <text x="1076" y="264" fill="#64748b" font-size="12">step-level credit</text>
    </g>

    <!-- track 05 -->
    <g filter="url(#shadow)">
      <rect x="1058" y="323" width="164" height="63" rx="12" fill="#121a2d" stroke="#475569"/>
      <text x="1076" y="351" fill="#67e8f9" font-size="14" font-weight="800">05</text>
      <text x="1109" y="351" fill="#f1f5f9" font-size="15" font-weight="700">Frontier</text>
      <text x="1076" y="372" fill="#64748b" font-size="12">context · experience</text>
    </g>

    <!-- track 06 -->
    <g filter="url(#shadow)">
      <rect x="838" y="493" width="232" height="76" rx="15" fill="#17172f" stroke="url(#accent)" stroke-width="1.8"/>
      <text x="860" y="523" fill="#c4b5fd" font-size="14" font-weight="800">06</text>
      <text x="894" y="523" fill="#f8fafc" font-size="17" font-weight="750">Unified Theory</text>
      <text x="860" y="550" fill="#a5b4fc" font-size="13">SFT × RL · distill · align</text>
    </g>
  </g>
</svg>
